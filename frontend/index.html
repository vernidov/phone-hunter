<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Phone Hunter BETA-1.0</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='12' ry='12' fill='%23000'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='11' ry='11' fill='none' stroke='%23b30000' stroke-width='1.5'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23b30000' stroke-width='1.2' stroke-dasharray='6 5' opacity='.5'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cline x1='19' y1='32' x2='45' y2='32' stroke='%23fff' stroke-width='1.5'/%3E%3Cline x1='32' y1='19' x2='32' y2='45' stroke='%23fff' stroke-width='1.5'/%3E%3Cellipse cx='32' cy='32' rx='7' ry='5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23b30000'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0a0a0a; --text: #c0c0c0; --bright: #e0e0e0;
            --accent: #b30000; --green: #00ff88; --red: #ff3366;
            --yellow: #ffcc00; --dim: #606060;
            --font: 'Courier New', 'Consolas', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 20px; }
        .search-line {
            display: flex; border: 1px solid #1a1a1a; margin-bottom: 10px;
            background: rgba(12,12,12,0.9);
        }
        .search-line .prompt {
            padding: 12px 14px; color: var(--accent); font-weight: bold; font-size: 12px;
            border-right: 1px solid #1a1a1a;
        }
        .search-line input {
            flex: 1; padding: 12px 14px; background: transparent; border: none;
            color: var(--bright); font-family: var(--font); font-size: 13px; outline: none;
        }
        .search-line input::placeholder { color: #2a2a2a; }
        .search-line button {
            padding: 12px 18px; background: transparent; border: none; border-left: 1px solid #1a1a1a;
            color: var(--accent); font-family: var(--font); font-size: 11px; cursor: pointer;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .search-line button:hover { background: rgba(179,0,0,0.1); color: #fff; }
        .search-line button:disabled { color: #333; cursor: not-allowed; }
        .output {
            background: rgba(12,12,12,0.9); border: 1px solid #1a1a1a;
            padding: 14px 16px; font-size: 10px; line-height: 1.7; color: var(--dim);
            white-space: pre-wrap; word-break: break-all; min-height: 300px;
        }
        .output .h { color: var(--accent); font-weight: bold; }
        .output .s { color: var(--bright); }
        .output .ok { color: var(--green); } .output .warn { color: var(--yellow); }
        .output .err { color: var(--red); } .output .c { color: #333; }
        .output .loc { color: #fff; font-weight: bold; }
        .graph-panel {
            margin-top: 12px;
            background: rgba(12,12,12,0.9); border: 1px solid #1a1a1a;
            border-radius: 6px; overflow: hidden;
        }
        .graph-header {
            padding: 8px 12px; border-bottom: 1px solid #1a1a1a;
            font-size: 9px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase;
        }
        .graph-body { padding: 8px; display: flex; justify-content: center; }
        .graph-svg { width: 100%; max-height: 250px; }
        .g-node { cursor: pointer; transition: all 0.2s; }
        .g-node:hover rect { filter: brightness(1.5); }
        .status-line {
            display: flex; justify-content: space-between; margin-top: 10px;
            font-size: 8px; color: #333; letter-spacing: 1px;
        }
        .status-line .on { color: var(--green); animation: statusPulse 1.5s infinite; }
        .status-line .off { color: var(--red); }
        @keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    </style>
</head>
<body>
    <div class="search-line">
        <span class="prompt">$</span>
        <input type="text" id="phoneInput" placeholder="+79001234567" autofocus spellcheck="false">
        <button id="searchBtn" onclick="doSearch()">Execute</button>
        <button onclick="clearAll()" style="border-left:1px solid #1a1a1a;color:var(--dim);">Clear</button>
    </div>
    <div class="output" id="output">
        <span class="c"># Phone Hunter BETA-1.0</span>
        <span class="c"># Created by VERNIDOV</span>
        <span class="c"># READY.</span>
    </div>
    <div class="graph-panel">
        <div class="graph-header">[ GRAPH ]</div>
        <div class="graph-body">
            <svg class="graph-svg" id="graphSvg" viewBox="0 0 300 200">
                <text x="150" y="100" text-anchor="middle" fill="#444" font-size="11" font-family="monospace">No data</text>
            </svg>
        </div>
    </div>
    <div class="status-line">
        <span id="statusText">? <span class="off">OFFLINE</span></span>
        <span>phone-hunter.onrender.com</span>
        <span id="queryCount">0 queries</span>
    </div>

    <script>
        const API = 'https://phone-hunter.onrender.com/api/v1';
        let qc = +(localStorage.getItem('hqc')||'0');
        let cr = null;
        const se = document.getElementById('statusText'), ce = document.getElementById('queryCount');
        ce.textContent = qc+' queries';

        async function checkStatus() {
            try {
                const r = await fetch('https://phone-hunter.onrender.com/');
                se.innerHTML = r.ok ? '? <span class="on">ONLINE</span>' : '? <span class="off">ERROR</span>';
            } catch(e) {
                se.innerHTML = '? <span class="off">OFFLINE</span>';
            }
        }
        checkStatus();
        setInterval(checkStatus, 10000);

        document.getElementById('phoneInput').addEventListener('keydown', e => {
            if(e.key==='Enter') doSearch();
        });

        function drawGraph(phone, country, region, city, operator) {
            const svg = document.getElementById('graphSvg');
            const sp = phone.length>12 ? phone.slice(0,9)+'...' : phone;
            const allNodes = [
                { text: sp, color: '#00ff88' },
                { text: country||null, color: '#b30000' },
                { text: region||null, color: '#ffcc00' },
                { text: city||null, color: '#fff' },
                { text: operator||null, color: '#ddd' }
            ];
            const nodes = allNodes.filter(n => n.text);
            if(!nodes.length) {
                svg.innerHTML = '<text x="150" y="100" text-anchor="middle" fill="#444" font-size="11" font-family="monospace">No data</text>';
                return;
            }
            const spacing = 180/(nodes.length+1), startY = 30;
            let s = '';
            for(let i=0; i<nodes.length-1; i++) {
                const y1 = startY + i*spacing + 12;
                const y2 = startY + (i+1)*spacing - 12;
                s += <line x1="150" y1="" x2="150" y2="" stroke="#333" stroke-width="1.5"/>;
                const my = (y1+y2)/2;
                s += <polygon points="146, 154, 146," fill="#666"/>;
            }
            for(let i=0; i<nodes.length; i++) {
                const y = startY + i*spacing;
                s += <g class="g-node" onmouseover="this.querySelector('rect').setAttribute('fill','#1a0000');this.querySelector('text').setAttribute('fill','#fff');" onmouseout="this.querySelector('rect').setAttribute('fill','#0a0a0a');this.querySelector('text').setAttribute('fill','');">;
                s += <rect x="50" y="" width="200" height="24" rx="4" fill="#0a0a0a" stroke="" stroke-width="1.5"/>;
                s += <text x="150" y="" text-anchor="middle" fill="" font-size="10" font-family="Courier New,monospace"></text></g>;
            }
            svg.innerHTML = s;
        }

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                if (typeof tg.ready === 'function') tg.ready();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    return tg.initDataUnsafe.user.id;
                }
                if (tg.initData && tg.initData.length > 0) {
                    try {
                        const params = new URLSearchParams(tg.initData);
                        const user = params.get('user');
                        if (user) {
                            const userObj = JSON.parse(user);
                            return userObj.id;
                        }
                    } catch(e) {}
                }
            }
            return null;
        }

        async function doSearch() {
            const raw = document.getElementById('phoneInput').value.trim();
            if(!raw) return;
            const btn = document.getElementById('searchBtn'), out = document.getElementById('output');
            
            const tg = getTelegramId();
            if (!tg) {
                out.innerHTML = '<span class="err">[!] Unable to get Telegram ID. Please open this Mini App from the bot\'s menu button.</span>';
                return;
            }
            
            btn.disabled = true; btn.textContent = '...'; out.innerHTML = '<span class="c">[~] Scanning...</span>';
            const headers = { 'Content-Type': 'application/json', 'X-Telegram-ID': String(tg) };
            
            try {
                const resp = await fetch(API+'/search', { method:'POST', headers, body:JSON.stringify({phone:raw}) });
                if (resp.status === 429) {
                    out.innerHTML = '<span class="err">[!] No requests left today. Come back tomorrow or buy more.</span><br><br><a href="https://t.me/phone_hunter_vernidov_bot" target="_blank"><button style="padding:10px 20px;margin-top:10px;background:#b30000;color:#fff;border:none;cursor:pointer;">Buy requests</button></a>';
                    btn.disabled = false; btn.textContent = 'Execute';
                    return;
                }
                const data = await resp.json(); cr = data; const r = data.result;
                const city = r.hlr.city||r.geo.city||'', region = r.hlr.region||r.geo.region_name||'';
                const area = r.hlr.area||'', country = r.validation.country||r.hlr.country||'';
                const operator = r.validation.operator||r.hlr.provider||'';
                drawGraph(r.query.normalized, country, region, city, operator);
                
                let log = [];
                log.push(<span class="h">=== MAIN ===</span>);
                log.push(<span class="s">Phone:</span>    );
                log.push(<span class="s">Operator:</span> <span class="loc"></span>);
                log.push(<span class="s">Country:</span>  );
                log.push('');
                log.push(<span class="h">=== LOCATION ===</span>);
                if(city) log.push(<span class="s">City:</span>     <span class="loc"></span>);
                if(region) log.push(<span class="s">Region:</span>   <span class="loc"></span>);
                if(area) log.push(<span class="s">District:</span>  <span class="loc"></span>);
                log.push('');
                const risk=r.risk_score;
                log.push(<span class="h">=== RISK ===</span>);
                log.push(<span class="s">Score:</span>    <span class="">/100</span>);
                log.push('');
                log.push(<span class="h">=== MESSENGERS ===</span>);
                for(const[k,v] of Object.entries(r.messengers)) log.push(  : );
                log.push('');
                log.push(<span class="h">=== LEAKS ===</span>);
                if(r.leaks.found_in_leaks&&r.leaks.leaks.length){ for(const l of r.leaks.leaks) log.push(  <span class="warn">?</span> ); }
                else log.push(  <span class="ok">? CLEAN</span>);
                log.push('');
                log.push(<span class="h">=== FRAUD ===</span>);
                if(r.fraud.has_complaints) log.push(  <span class="err">?</span> );
                else log.push(  <span class="ok">? CLEAN</span>);
                log.push('');
                log.push(<span class="h">=== LINE ===</span>);
                log.push(  );
                log.push('');
                log.push(<span class="h">=== PORT ===</span>);
                log.push(  );
                out.innerHTML = log.join('\n');
                qc++; localStorage.setItem('hqc', qc); ce.textContent = qc+' queries';
            } catch(e) { out.innerHTML = '<span class="err">[!] CONNECTION REFUSED</span>'; }
            btn.disabled = false; btn.textContent = 'Execute';
        }

        function clearAll() {
            document.getElementById('phoneInput').value = '';
            document.getElementById('output').innerHTML = '<span class="c"># Phone Hunter BETA-1.0</span>\n<span class="c"># READY.</span>';
            document.getElementById('graphSvg').innerHTML = '<text x="150" y="100" text-anchor="middle" fill="#444" font-size="11" font-family="monospace">No data</text>';
            cr = null; document.getElementById('phoneInput').focus();
        }
    </script>
</body>
</html>
