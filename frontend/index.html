<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Phone Hunter BETA-1.0</title>
    <style>
        :root { --bg: #0a0a0a; --text: #c0c0c0; --bright: #e0e0e0; --accent: #b30000; --green: #00ff88; --red: #ff3366; --yellow: #ffcc00; --dim: #606060; --font: 'Courier New', monospace; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 20px; }
        #matrix { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; opacity:0.2; }
        .search-line { display: flex; border:1px solid #1a1a1a; margin-bottom:10px; background:rgba(12,12,12,0.9); }
        .search-line .prompt { padding:12px 14px; color:var(--accent); border-right:1px solid #1a1a1a; }
        .search-line input { flex:1; padding:12px 14px; background:transparent; border:none; color:var(--bright); font-family:var(--font); font-size:13px; outline:none; }
        .search-line input::placeholder { color:#2a2a2a; }
        .search-line button { padding:12px 18px; background:transparent; border:none; border-left:1px solid #1a1a1a; color:var(--accent); cursor:pointer; text-transform:uppercase; }
        .search-line button:hover { background:rgba(179,0,0,0.1); color:#fff; }
        .search-line button:disabled { color:#333; }
        .output { background:rgba(12,12,12,0.9); border:1px solid #1a1a1a; padding:14px; font-size:10px; line-height:1.7; color:var(--dim); white-space:pre-wrap; min-height:300px; }
        .output .h { color:var(--accent); font-weight:bold; }
        .output .s { color:var(--bright); }
        .output .ok { color:var(--green); } .output .warn { color:var(--yellow); }
        .output .err { color:var(--red); } .output .c { color:#333; }
        .output .loc { color:#fff; font-weight:bold; }
        .graph-panel { margin-top:16px; background:rgba(12,12,12,0.9); border:1px solid #1a1a1a; border-radius:6px; overflow:hidden; }
        .graph-header { padding:8px 12px; border-bottom:1px solid #1a1a1a; font-size:9px; letter-spacing:2px; color:var(--accent); }
        .graph-body { padding:8px; display:flex; justify-content:center; min-height:160px; }
        .graph-svg { width:100%; max-height:180px; }
        .status-line { display:flex; justify-content:space-between; margin-top:12px; font-size:8px; color:#333; }
        .status-line .on { color:var(--green); } .status-line .off { color:var(--red); }
        .cursor { display:inline-block; width:8px; height:14px; background:#fff; animation:blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .typing-line { opacity:0; animation:typing 0.2s forwards; }
        @keyframes typing { to { opacity:1; transform:translateX(0); } }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="search-line">
    <span class="prompt">$</span>
    <input type="text" id="phoneInput" placeholder="+79001234567" autofocus spellcheck="false">
    <button onclick="clearAll()" style="border-left:1px solid #1a1a1a;color:var(--dim);">Clear</button>
    <button id="searchBtn" class="primary-btn" onclick="doSearch()">SCAN</button>
</div>
<div class="output" id="output">
    <span class="c"># Phone Hunter BETA-1.0</span>
    <span class="c"># READY.</span>
</div>
<div class="graph-panel">
    <div class="graph-header">[ GRAPH ]</div>
    <div class="graph-body">
        <svg class="graph-svg" id="graphSvg" viewBox="0 0 300 180">
            <text x="150" y="90" text-anchor="middle" fill="#444" font-size="10">No data</text>
        </svg>
    </div>
</div>
<div class="status-line">
    <span id="statusText">? <span class="off">OFFLINE</span></span>
    <span>phone-hunter.onrender.com</span>
    <span id="queryCount">0 queries</span>
</div>

<script>
    // Matrix
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = '01PHONEHUNTEROSINT';
    const fontSize = 14;
    let cols = Math.floor(canvas.width / fontSize);
    let drops = Array(cols).fill(1);
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = fontSize + 'px monospace';
        for (let i=0; i<drops.length; i++) {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, drops[i]*fontSize);
            if (drops[i]*fontSize > canvas.height && Math.random()>0.975) drops[i]=0;
            drops[i]++;
        }
    }
    setInterval(draw, 40);
    window.addEventListener('resize', () => { canvas.width=window.innerWidth; canvas.height=window.innerHeight; cols = Math.floor(canvas.width/fontSize); drops = Array(cols).fill(1); });

    // API
    const API = 'https://phone-hunter.onrender.com/api/v1';
    const BOT_CHECK = 'https://phone-hunter-bot.onrender.com/check-balance';
    let qc = +(localStorage.getItem('hqc')||0);
    const statusSpan = document.getElementById('statusText');
    const queryCountSpan = document.getElementById('queryCount');
    queryCountSpan.textContent = qc + ' queries';
    async function checkStatus() {
        try { const r = await fetch('https://phone-hunter.onrender.com/'); statusSpan.innerHTML = r.ok ? '? <span class="on">ONLINE</span>' : '? <span class="off">ERROR</span>'; } catch(e) { statusSpan.innerHTML = '? <span class="off">OFFLINE</span>'; }
    }
    checkStatus(); setInterval(checkStatus, 10000);
    document.getElementById('phoneInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

    function drawGraph(phone, country, region, city, operator) {
        const svg = document.getElementById('graphSvg');
        const nodes = [];
        if (phone) nodes.push({ text: phone.length>12 ? phone.slice(0,9)+'...' : phone, color: '#fff' });
        if (country) nodes.push({ text: country, color: '#ccc' });
        if (region) nodes.push({ text: region, color: '#aaa' });
        if (city) nodes.push({ text: city, color: '#888' });
        if (operator) nodes.push({ text: operator, color: '#666' });
        if (!nodes.length) { svg.innerHTML = '<text x="150" y="90" text-anchor="middle" fill="#444" font-size="10">No data</text>'; return; }
        const spacing = 140/(nodes.length+1);
        let s = '';
        for (let i=0; i<nodes.length; i++) {
            const y = 20 + i*spacing;
            s += <rect x="50" y="" width="200" height="20" rx="3" fill="#0a0a0a" stroke="" stroke-width="1"/>;
            s += <text x="60" y="" fill="" font-size="10" font-family="monospace"></text>;
        }
        svg.innerHTML = s;
    }

    function typeLine(element, text, delay) {
        return new Promise(resolve => {
            setTimeout(() => {
                const div = document.createElement('div');
                div.className = 'typing-line';
                div.innerHTML = text;
                element.appendChild(div);
                resolve();
            }, delay);
        });
    }

    async function doSearch() {
        const raw = document.getElementById('phoneInput').value.trim();
        if (!raw) return;
        const btn = document.getElementById('searchBtn');
        const outDiv = document.getElementById('output');
        btn.disabled = true;
        btn.textContent = '...';
        outDiv.innerHTML = '';
        await typeLine(outDiv, '<span class="c">[~] Checking balance...</span>', 0);
        try {
            const tg = '7725956756';
            const balanceResp = await fetch(BOT_CHECK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: tg })
            });
            if (balanceResp.status === 429) {
                // –≈ƒ»–≈ “ Õ¿ 429.HTML
                window.location.href = '429.html';
                return;
            }
            if (balanceResp.status !== 200) throw new Error('Balance check failed');
            await typeLine(outDiv, '<span class="c">[~] Balance OK, scanning...</span>', 200);
            await typeLine(outDiv, '<span class="c">[~] HLR lookup...</span>', 400);
            await typeLine(outDiv, '<span class="c">[~] Leak databases...</span>', 800);
            await typeLine(outDiv, '<span class="c">[~] Fraud analysis...</span>', 1200);
            const headers = { 'Content-Type': 'application/json', 'X-Telegram-ID': tg };
            const resp = await fetch(API + '/search', { method: 'POST', headers, body: JSON.stringify({ phone: raw }) });
            const data = await resp.json();
            const r = data.result;
            const city = r.hlr.city || r.geo.city || '';
            const region = r.hlr.region || r.geo.region_name || '';
            const country = r.validation.country || r.hlr.country || '';
            const operator = r.validation.operator || r.hlr.provider || '';
            drawGraph(r.query.normalized, country, region, city, operator);
            let lines = [];
            lines.push(<span class="h">=== MAIN ===</span>);
            lines.push(<span class="s">Phone:</span>    );
            lines.push(<span class="s">Operator:</span> );
            lines.push(<span class="s">Country:</span>  );
            lines.push('');
            lines.push(<span class="h">=== LOCATION ===</span>);
            if (city) lines.push(<span class="s">City:</span>     );
            if (region) lines.push(<span class="s">Region:</span>   );
            lines.push('');
            lines.push(<span class="h">=== RISK ===</span>);
            lines.push(<span class="s">Score:</span>    /100);
            lines.push('');
            lines.push(<span class="h">=== MESSENGERS ===</span>);
            for (const [k,v] of Object.entries(r.messengers)) lines.push(  : );
            lines.push('');
            lines.push(<span class="h">=== LEAKS ===</span>);
            if (r.leaks.found_in_leaks && r.leaks.leaks.length) {
                for (const l of r.leaks.leaks) lines.push(  <span class="warn">?</span> );
            } else lines.push(  <span class="ok">? CLEAN</span>);
            lines.push('');
            lines.push(<span class="h">=== FRAUD ===</span>);
            lines.push(r.fraud.has_complaints ?   <span class="err">?</span>  :   <span class="ok">? CLEAN</span>);
            for (let i=0; i<lines.length; i++) await typeLine(outDiv, lines[i], 1400 + i*80);
            qc++; localStorage.setItem('hqc', qc); queryCountSpan.textContent = qc + ' queries';
        } catch(e) { await typeLine(outDiv, '<span class="err">[!] CONNECTION REFUSED</span>', 1500); }
        btn.disabled = false; btn.textContent = 'SCAN';
    }
    function clearAll() {
        document.getElementById('phoneInput').value = '';
        document.getElementById('output').innerHTML = '<span class="c"># Phone Hunter BETA-1.0</span><br><span class="c"># READY.</span>';
        document.getElementById('graphSvg').innerHTML = '<text x="150" y="90" text-anchor="middle" fill="#444" font-size="10">No data</text>';
    }
</script>
</body>
</html>
